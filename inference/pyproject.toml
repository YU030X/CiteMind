[project]
name = "citemind-inference"
version = "0.1.0"
description = "CiteMind 内部推理服务：受限的 embedding 协议与就绪状态"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "torch>=2.7,<3",
  "transformers>=4.56,<6",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citemind_inference"]

# PyTorch 必须来自 CPU 专用 index：默认 PyPI 的 torch 会带上 nvidia-* CUDA 依赖。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: requires the real local BGE weights and is opt-in via RUN_MODEL_TESTS=1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# tests/golden 是独立断网环境生成的取证脚本与数据，原样保留不作为项目代码检查。
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# tests/golden 是独立断网环境生成的取证脚本与数据，原样保留不参与项目类型检查。
exclude = ["tests/golden"]
