name: CI

# 触发范围：仅 main 分支 push、任意 PR、手动。permissions 只读仓储内容，不申请任何写权限。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 workflow 的同一 ref（PR 用编号）只保留最新一次运行，新的运行取消旧的。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 只判断 inference 相关改动，不用 path filter 跳过整个 workflow（否则必需检查会一直 pending）。
  # 手动触发必须运行 inference；PR 用 merge-base 三点 diff；push 用 before..sha，零 before SHA 保守全量。
  changes:
    name: changes (inference path gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inference: ${{ steps.detect.outputs.inference }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect inference-related changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "inference=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # 三点 diff 以 merge-base 为基准，只算本 PR 引入的改动。
            range="origin/$BASE_REF...HEAD"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # 新分支或首次推送没有可比较的 before，保守地视为有改动。
            echo "inference=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="$BEFORE_SHA..$SHA"
          fi
          # --no-renames 让改名同时保留旧/新路径，避免 inference/ 下的文件被移出时漏判。
          if ! changed="$(git diff --no-renames --name-only "$range" 2>/dev/null)"; then
            # 无法解析 diff 范围（如 force push 后 before 已不可达）时，保守地运行 inference。
            echo "inference=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(inference/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "inference=true" >> "$GITHUB_OUTPUT"
          else
            echo "inference=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: backend (ruff / mypy / pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (0.12.4) and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Sync frozen dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run --no-sync ruff check backend/src migrations tests

      - name: Mypy
        run: uv run --no-sync mypy

      - name: Pytest (unit, no integration)
        run: uv run --no-sync pytest -m "not integration" -q -p no:cacheprovider

  inference:
    name: inference (ruff / mypy / pytest)
    needs: changes
    if: needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: inference
    env:
      # 模型离线与模型测试显式关闭：CI 不下载权重、不跑真实模型用例。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RUN_MODEL_TESTS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (0.12.4) and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "inference/uv.lock"

      - name: Check lockfile
        run: uv lock --check

      - name: Sync frozen dependencies (dev group)
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run --no-sync ruff check

      - name: Mypy
        run: uv run --no-sync mypy

      - name: Pytest (no model tests)
        run: uv run --no-sync pytest -m "not model" -q -p no:cacheprovider

  frontend:
    name: frontend (jev / test / build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm (11.22.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.22.0"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Jev tooling test (local fake)
        run: pnpm test:jev

      # frontend/tests/markdown.test.ts 会通过 `uv run python -c` 调用后端
      # rag_backend.generation.answer_schema，因此前端 job 也需要根 Python 环境。
      - name: Setup uv (0.12.4) and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync frozen backend dependencies
        run: uv sync --frozen

      - name: Frontend tests
        # 嵌套的 `uv run` 只使用上面显式 sync 的环境，不再隐式安装或解锁。
        env:
          UV_NO_SYNC: "1"
        run: pnpm --dir frontend test

      - name: Frontend build
        run: pnpm --dir frontend build
