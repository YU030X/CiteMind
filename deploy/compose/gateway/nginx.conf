# CiteMind 前端网关：同源提供 SPA 静态资源，并把 /api 动态代理到内部 api 服务。
# 由 deploy/compose/frontend.Dockerfile 在构建期 COPY 进镜像并执行 nginx -t；
# 不用 bind mount，避免 Windows 宿主 CRLF 破坏配置。

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 子 location 的 add_header 默认整组替换父级；merge 让安全头在各级都保留（nginx >= 1.29.3）。
    add_header_inherit merge;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 网关自身存活探针：本地返回，不依赖 api；api 故障时网关仍应 healthy。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 同源 API 代理：容器重建后 IP 会变化，用 Docker 嵌入式 DNS + 变量 upstream 重新解析，
    # 避免 nginx 启动时缓存旧 IP（静态 proxy_pass 还会让 `nginx -t` 在构建期解析 api 失败）。
    # 变量 proxy_pass 不会自动拼接 URI，必须显式保留 request_uri，/api/v1 前缀原样透传。
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # api 不可用时保持代理层错误（502），绝不回退到 SPA 的 200 HTML。
    }

    # 带内容哈希的构建产物可长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML 入口不缓存，发布后立即引用新的哈希资源。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退：其余路径交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
