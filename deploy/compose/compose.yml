# CiteMind 六服务本地切片：postgres + pgvector、Redis、独立 Celery worker，以及 api、
# inference、frontend-gateway 三个进程容器。业务表与向量列由 Alembic 迁移创建。
# api 与 worker 复用 deploy/compose/Dockerfile 的 runtime 基础 stage，只覆盖 target 与命令；
# inference 用 inference/ 独立上下文构建；frontend-gateway 用 deploy/compose/frontend.Dockerfile
# 构建（Node 构建 + 非 root nginx）。自建服务不写 image:，镜像由本仓库 Dockerfile 固定。
# 第三方镜像用 digest 固定；宿主端口默认只绑定 127.0.0.1，可用变量覆盖。
# inference 已能离线编码 kind=document 文本（query 与 rerank 未实现）；worker 写入事务与
# dispatcher/业务 API 仍未实现。云 LLM 用量账本 llm_usage 由迁移 20260923_0004 落地；
# 一次性真实探针 rag_backend.llm_probe 默认关闭、不随容器启动，已由用户执行一次真实
# DeepSeek 成功调用并与 llm_usage 落账回读；Phase 0 工程底座退出条件据此达成。
# 环境变量统一为无前缀裸名（如 MIGRATION_DB_PASSWORD、DATABASE_URL）。
# 命令（均从仓库根目录执行，单行）：
#   docker compose --env-file .env.example -f deploy/compose/compose.yml config --quiet
#   docker compose --env-file .env -f deploy/compose/compose.yml up -d --build --wait
#   docker compose --env-file .env -f deploy/compose/compose.yml down
#   docker compose --env-file .env -f deploy/compose/compose.yml down -v
# `down -v` 删除数据卷；initdb 脚本只在空卷上执行，角色或 ACL 需要重建时必须用它。
# `docker compose config` 会把插值后的密码明文打印出来，不要分享该输出。
# 首次真实启动前按 docs/development.md 配置已忽略的根 .env；根 .env 已存在时不要覆盖，
# 只补齐 Compose 需要的密码、端口与 inference 令牌变量，并把仍在使用旧 CITEMIND_* 名的
# 本地键手动改成裸名（旧键会导致应用启动失败）。

name: citemind

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      # 迁移账号（也是集群超级用户）：vector.control 没有 trusted=true，
      # 安装与升级 vector 扩展需要超级用户，因此本地高权限账号只交给迁移进程。
      POSTGRES_USER: citemind_migrator
      POSTGRES_DB: citemind
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?必须设置 MIGRATION_DB_PASSWORD}
      # 固定集群编码、locale 与 data checksums；官方入口把该值原样拼进 initdb 参数。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      # initdb 脚本只在空数据卷执行，用它创建 api/worker 运行角色与测试库。
      API_DB_PASSWORD: ${API_DB_PASSWORD:?必须设置 API_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?必须设置 WORKER_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 完成标记只在角色、测试库与 ACL 全部初始化成功后写入；半初始化卷不能变为 healthy。
      test: ["CMD-SHELL", "test -f \"$${PGDATA}/.citemind-init-complete\" && pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    restart: unless-stopped
    environment:
      # redis-cli 从该变量读取密码，healthcheck 因此不需要把密码写进命令行。
      REDISCLI_AUTH: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    # 与 worker 共用 runtime stage，只覆盖 target 与启动命令。
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      # 容器内用服务名与内部端口；绝不透传宿主 127.0.0.1 DSN，避免容器访问宿主回环。
      DATABASE_URL: postgresql+psycopg://citemind_api:${API_DB_PASSWORD:?必须设置 API_DB_PASSWORD}@postgres:5432/citemind
      # 登录限流依赖 Redis；未配置时登录会 fail closed 返回 503，不会回退到进程内计数。
      REDIS_URL: redis://:${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}@redis:6379/0
      # 本地网关只发布回环 HTTP 端口，显式关闭 Secure Cookie，并把状态变更来源限定在回环。
      SESSION_COOKIE_SECURE: "0"
      ALLOWED_ORIGINS: http://127.0.0.1:${GATEWAY_PORT:-58080},http://localhost:${GATEWAY_PORT:-58080}
      # CSRF 令牌派生密钥；这是开发占位值，生产环境会被启动校验拒绝。
      CSRF_SECRET: ${CSRF_SECRET:-development-csrf-secret}
      # 只有网关网段内的直连对端才可提供 X-Real-IP；否则退回对端地址。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.28.10.0/24}
      # 上传原文件落在 api 专用私有命名卷；路径只由服务端 KB ID 与内容 SHA-256 派生。
      DOCUMENT_STORAGE_DIRECTORY: /var/lib/citemind/documents
      # Phase 1：由 API 进程 lifespan 承载 outbox dispatcher，向 Redis 的 ingest 队列投递。
      # 非 Compose 默认关闭（Settings.dispatcher_enabled=false），避免测试进程意外连 broker。
      DISPATCHER_ENABLED: "true"
      # 处理中任务过期租约恢复与 worker 真实入库共用同一开关；api 侧与 worker 必须一致，
      # 否则 dispatcher 不会回收卡住的活动任务。默认 0 时安全接收壳行为不变。
      INGEST_PROCESSING_ENABLED: ${INGEST_PROCESSING_ENABLED:-0}
      # 问答生成的 token 预算：输入目标由 api 侧本地 tokenizer 估算执行，输出上限留给 provider 的
      # max_tokens 精确强制。Settings 默认值 4000/800，启动校验拒绝非正数。
      LLM_INPUT_TOKEN_BUDGET: ${LLM_INPUT_TOKEN_BUDGET:-4000}
      LLM_OUTPUT_TOKEN_BUDGET: ${LLM_OUTPUT_TOKEN_BUDGET:-800}
      # 检索与问答都要做查询编码；未配置时这两个接口静态 503。
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:?必须设置 INFERENCE_TOKEN}
      # 业务问答生成默认关闭；开启时必须同时注入非占位 LLM_API_KEY，否则启动校验失败。
      LLM_ENABLED: ${LLM_ENABLED:-0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    volumes:
      # api 专用命名卷：镜像内该目录已归属 uid 10001，新建卷会继承该所有权。
      # api 是唯一写入者；worker 只读同卷；inference 不可见。
      - api-documents:/var/lib/citemind/documents
    networks:
      # default 用于访问 postgres/redis；gateway 是网关到 api 的专用入口网段。
      - default
      - gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        # 限流器惰性连接，只需 redis 容器启动即可。
        condition: service_started
    healthcheck:
      # 用容器内 Python 走 HTTP 探针；非 200 会抛异常，退出码非零。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  inference:
    # inference 有独立 pyproject/uv.lock，用 inference/ 目录作为构建上下文。
    build:
      context: ../../inference
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      # 内部接口 Bearer token；开发占位值，生产环境使用该值会启动失败。
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:?必须设置 INFERENCE_TOKEN}
      # 模型烘入镜像，不挂宿主模型卷、不在启动时下载。
      EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      EMBEDDING_MODEL_REVISION: 7999e1d3359715c523056ef9478215996d62a620
      EMBEDDING_TORCH_THREADS: ${EMBEDDING_TORCH_THREADS:-2}
      OMP_NUM_THREADS: ${EMBEDDING_TORCH_THREADS:-2}
      MKL_NUM_THREADS: ${EMBEDDING_TORCH_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${EMBEDDING_TORCH_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    healthcheck:
      # 保持 /health liveness；模型可用性另查 /ready 与 /capabilities。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    # 与 API 进程分离的 Celery worker；镜像由本仓库构建，基础镜像按 digest 固定。
    # 默认接收壳不调用 inference；开启真实入库后通过内部 HTTP 执行 embedding。
    # 构建期从 inference 镜像复制已校验的 tokenizer 四件产物，不使用共享模型卷。
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: worker
      additional_contexts:
        # 产物只在 inference 构建期生成；作为具名上下文提供给 Dockerfile 的 COPY --from。
        model_assets: service:inference
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      # broker 指向 Compose 网络内的 redis 服务，密码沿用 Redis 的认证变量。
      REDIS_URL: redis://:${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}@redis:6379/0
      # worker 使用非特权的 citemind_worker 角色执行接收与入库事务；probe 任务不写库。
      DATABASE_URL: postgresql+psycopg://citemind_worker:${WORKER_DB_PASSWORD:?必须设置 WORKER_DB_PASSWORD}@postgres:5432/citemind
      # worker 只读同容器路径的 api 存储卷来读取已登记原始文件；路径由服务端配置固定。
      DOCUMENT_STORAGE_DIRECTORY: /var/lib/citemind/documents
      # 内部 embedding 受限客户端使用同一 INFERENCE_TOKEN；基址默认为内部服务 9000 端口。
      # 本切片不向 inference 建立 depends_on：inference 故障时 worker 仍应能启动与消费。
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:?必须设置 INFERENCE_TOKEN}
      # 真实入库默认关闭；只有显式 INGEST_PROCESSING_ENABLED=1 才启用。开启前必须先成功
      # 迁移到 20260925_0007（0006 缺 knowledge_base 两列 UPDATE）并配置 INFERENCE_TOKEN
      # （见 docs/deployment.md）。0 时 worker 行为与既有安全接收壳一致。
      INGEST_PROCESSING_ENABLED: ${INGEST_PROCESSING_ENABLED:-0}
    volumes:
      # 与 api 共用同一命名卷，但以只读方式挂载；worker 绝不写入或替换原文件。
      - api-documents:/var/lib/citemind/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - rag_backend.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      # 同时消费 ingest 专用队列与 probe 的默认队列，两类任务不混淆。
      - --queues=celery,ingest
    healthcheck:
      # 通过 broker 回环的 inspect ping 确认 worker 真的在消费；无回复时 grep 失败。
      test: ["CMD-SHELL", "celery -A rag_backend.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend-gateway:
    # 应用唯一入口：同源提供 SPA 静态资源并代理 /api 到内部 api:8000。
    build:
      context: ../..
      dockerfile: deploy/compose/frontend.Dockerfile
    restart: unless-stopped
    # 唯一对外发布的端口，且只绑定回环；api/inference/worker 不发布宿主端口。
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-58080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      # 网关只接 gateway 网络，因此对 api 的连接一定来自可信网段。
      - gateway
    healthcheck:
      # 网关自身探针不经过 api，api 故障不回退 SPA。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  # api 上传原文件私有存储；不使用 bind mount，避免宿主权限与 CRLF 问题。
  api-documents:

networks:
  default:
  # 固定网关↔api 的专用网段，让 api 的可信代理 CIDR 可确定配置，不依赖运行时随机子网。
  gateway:
    ipam:
      config:
        - subnet: 172.28.10.0/24
