# CiteMind 六服务本地切片：postgres + pgvector、Redis、独立 Celery worker，以及 api、
# inference、frontend-gateway 三个进程容器。业务表与向量列由 Alembic 迁移创建。
# api 与 worker 复用 deploy/compose/Dockerfile 的 runtime 基础 stage，只覆盖 target 与命令；
# inference 用 inference/ 独立上下文构建；frontend-gateway 用 deploy/compose/frontend.Dockerfile
# 构建（Node 构建 + 非 root nginx）。自建服务不写 image:，镜像由本仓库 Dockerfile 固定。
# 第三方镜像用 digest 固定；宿主端口默认只绑定 127.0.0.1，可用变量覆盖。
# 本切片 inference 只有进程/能力边界：embedding.ready=false，受保护 embed 返回 503 且无 vectors；
# 真实 embedding、worker 写入事务与 dispatcher/业务 API 仍未实现。
# 命令（均从仓库根目录执行，单行）：
#   docker compose --env-file .env.example -f deploy/compose/compose.yml config --quiet
#   docker compose --env-file .env -f deploy/compose/compose.yml up -d --build --wait
#   docker compose --env-file .env -f deploy/compose/compose.yml down
#   docker compose --env-file .env -f deploy/compose/compose.yml down -v
# `down -v` 删除数据卷；initdb 脚本只在空卷上执行，角色或 ACL 需要重建时必须用它。
# `docker compose config` 会把插值后的密码明文打印出来，不要分享该输出。
# 首次真实启动前按 docs/development.md 配置已忽略的根 .env；根 .env 已存在时不要覆盖，
# 只补齐 Compose 需要的密码、端口与 inference 令牌变量。

name: citemind

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      # 迁移账号（也是集群超级用户）：vector.control 没有 trusted=true，
      # 安装与升级 vector 扩展需要超级用户，因此本地高权限账号只交给迁移进程。
      POSTGRES_USER: citemind_migrator
      POSTGRES_DB: citemind
      POSTGRES_PASSWORD: ${CITEMIND_MIGRATION_DB_PASSWORD:?必须设置 CITEMIND_MIGRATION_DB_PASSWORD}
      # 固定集群编码、locale 与 data checksums；官方入口把该值原样拼进 initdb 参数。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      # initdb 脚本只在空数据卷执行，用它创建 api/worker 运行角色与测试库。
      CITEMIND_API_DB_PASSWORD: ${CITEMIND_API_DB_PASSWORD:?必须设置 CITEMIND_API_DB_PASSWORD}
      CITEMIND_WORKER_DB_PASSWORD: ${CITEMIND_WORKER_DB_PASSWORD:?必须设置 CITEMIND_WORKER_DB_PASSWORD}
    ports:
      - "127.0.0.1:${CITEMIND_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 完成标记只在角色、测试库与 ACL 全部初始化成功后写入；半初始化卷不能变为 healthy。
      test: ["CMD-SHELL", "test -f \"$${PGDATA}/.citemind-init-complete\" && pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    restart: unless-stopped
    environment:
      # redis-cli 从该变量读取密码，healthcheck 因此不需要把密码写进命令行。
      REDISCLI_AUTH: ${CITEMIND_REDIS_PASSWORD:?必须设置 CITEMIND_REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${CITEMIND_REDIS_PASSWORD:?必须设置 CITEMIND_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${CITEMIND_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    # 与 worker 共用 runtime stage，只覆盖 target 与启动命令。
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      CITEMIND_ENVIRONMENT: development
      # 容器内用服务名与内部端口；绝不透传宿主 127.0.0.1 DSN，避免容器访问宿主回环。
      CITEMIND_DATABASE_URL: postgresql+psycopg://citemind_api:${CITEMIND_API_DB_PASSWORD:?必须设置 CITEMIND_API_DB_PASSWORD}@postgres:5432/citemind
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 用容器内 Python 走 HTTP 探针；非 200 会抛异常，退出码非零。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  inference:
    # inference 有独立 pyproject/uv.lock，用 inference/ 目录作为构建上下文。
    build:
      context: ../../inference
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CITEMIND_ENVIRONMENT: development
      # 内部接口 Bearer token；开发占位值，生产环境使用该值会启动失败。
      CITEMIND_INFERENCE_TOKEN: ${CITEMIND_INFERENCE_TOKEN:?必须设置 CITEMIND_INFERENCE_TOKEN}
    healthcheck:
      # /health 只表示进程存活；embedding 未就绪也应为 healthy，由 /capabilities 如实报告。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    # 与 API 进程分离的 Celery worker；镜像由本仓库构建，基础镜像按 digest 固定。
    # worker 不依赖 inference：本切片没有 embedding 任务。
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      CITEMIND_ENVIRONMENT: development
      # broker 指向 Compose 网络内的 redis 服务，密码沿用 Redis 的认证变量。
      CITEMIND_REDIS_URL: redis://:${CITEMIND_REDIS_PASSWORD:?必须设置 CITEMIND_REDIS_PASSWORD}@redis:6379/0
      # worker 使用非特权的 citemind_worker 角色；probe 任务不写库，此 DSN 为后续入库事务预留。
      CITEMIND_DATABASE_URL: postgresql+psycopg://citemind_worker:${CITEMIND_WORKER_DB_PASSWORD:?必须设置 CITEMIND_WORKER_DB_PASSWORD}@postgres:5432/citemind
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - evidencehub.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    healthcheck:
      # 通过 broker 回环的 inspect ping 确认 worker 真的在消费；无回复时 grep 失败。
      test: ["CMD-SHELL", "celery -A evidencehub.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend-gateway:
    # 应用唯一入口：同源提供 SPA 静态资源并代理 /api 到内部 api:8000。
    build:
      context: ../..
      dockerfile: deploy/compose/frontend.Dockerfile
    restart: unless-stopped
    # 唯一对外发布的端口，且只绑定回环；api/inference/worker 不发布宿主端口。
    ports:
      - "127.0.0.1:${CITEMIND_GATEWAY_PORT:-58080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 网关自身探针不经过 api，api 故障不回退 SPA。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
